<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi and Fly</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;min-height:100%;background:#0b0b0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:420px;margin:0 auto;padding:48px 20px;text-align:center}
  h1{font-size:26px;margin:0 0 6px;color:#FFD700}
  p{opacity:.85;line-height:1.5;margin:0 0 26px}
  a.btn{display:block;margin:12px 0;padding:16px;border-radius:14px;text-decoration:none;font-weight:800;font-size:17px;color:#111;background:#FFD700}
  a.btn.dark{background:#fff}
  .small{font-size:13px;opacity:.6;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚕 Taxi and Fly</h1>
  <p id="msg">Άνοιγμα καταστήματος εφαρμογών…</p>
  <a class="btn" id="btnPlay" href="#">▶ Google Play (Android)</a>
  <a class="btn dark" id="btnApp" href="#"> App Store (iPhone)</a>
  <div class="small">Αν δεν ανοίξει μόνο του, πάτησε το κατάστημα του κινητού σου.</div>
</div>
<script>
(function(){
  // Το QR του οδηγού δείχνει εδώ (get.html?qr=ID). iPhone → App Store, Android → Play Store
  // (με το qrId στο referrer, όπως πριν), οτιδήποτε άλλο → δύο κουμπιά.
  var q = new URLSearchParams(location.search);
  var qr = String(q.get('qr') || q.get('qrId') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var PLAY = 'https://play.google.com/store/apps/details?id=com.taxiandfly.client' +
             (qr ? '&referrer=' + encodeURIComponent('qrId=' + qr) : '');
  var APP  = 'https://apps.apple.com/app/id6804729201';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  document.getElementById('btnPlay').href = PLAY;
  document.getElementById('btnApp').href = APP;
  var msg = document.getElementById('msg');
  if (isIOS) {
    msg.textContent = 'Άνοιγμα App Store…';
    location.replace(APP);
  } else if (isAndroid) {
    msg.textContent = 'Άνοιγμα Google Play…';
    // market:// ανοίγει απευθείας την εφαρμογή Play· αν λείπει, μένει το https link.
    location.replace('market://details?id=com.taxiandfly.client' + (qr ? '&referrer=' + encodeURIComponent('qrId=' + qr) : ''));
    setTimeout(function(){ location.replace(PLAY); }, 1200);
  } else {
    msg.textContent = 'Κατέβασε την εφαρμογή Taxi and Fly:';
  }
})();
</script>
</body>
</html>
