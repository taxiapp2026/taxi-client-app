workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-appstore
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.taxiandfly.client
        XCODE_PROJECT: ios/TaxiAndFlyClient.xcodeproj
        XCODE_SCHEME: TaxiAndFlyClient
        APP_STORE_APPLE_ID: 6804729201
      xcode: latest
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS || true)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" --platform IOS || true)
          LATEST=0
          for n in "$TF" "$AS" 32; do
            case "$n" in
              ''|*[!0-9]*) ;;
              *) if [ "$n" -gt "$LATEST" ]; then LATEST="$n"; fi ;;
            esac
          done
          NEW=$((LATEST + 1))
          agvtool new-version -all "$NEW"
          echo "iOS build number -> $NEW"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ioannestrantalides@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
